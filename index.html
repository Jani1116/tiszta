<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naptár PRO</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --text: #ffffff;
            --accent: #007aff; --border: #2c2c2e; --secondary: #8e8e93;
            --success: #30d158;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); user-select: none; }
        .container { max-width: 600px; margin: auto; background: #121212; padding: 15px; border-radius: 28px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.8); box-sizing: border-box; }
        
        .nav-group { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { background: none; border: none; color: var(--accent); font-size: 18px; cursor: pointer; padding: 0 8px; }
        .nav-title { font-weight: bold; font-size: 15px; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .weekday-header { text-align: center; font-size: 12px; color: var(--secondary); padding: 5px 0; font-weight: bold; }
        
        .day-cell { background: var(--card); border: 1px solid var(--border); border-radius: 10px; height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 2px; box-sizing: border-box; }
        .day-cell.empty { background: transparent; border: none; height: auto; }
        .day-num { font-size: 14px; font-weight: bold; color: var(--text); }
        .day-cell input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--success); margin: 0; }

        .stats-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; margin-top: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
        .stats-row { display: flex; justify-content: space-between; align-items: center; color: var(--secondary); }
        .stats-value { font-weight: bold; color: var(--success); font-size: 15px; }

        .mode-toggle { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-weight: bold; padding: 10px; border-radius: 12px; cursor: pointer; margin-bottom: 12px; font-size: 14px; }

        /* Éves nézet stílusok */
        .year-view-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        @media (max-width: 480px) { .year-view-container { grid-template-columns: repeat(2, 1fr); } }
        .mini-month { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px; }
        .mini-month-title { font-size: 11px; font-weight: bold; text-align: center; margin-bottom: 4px; color: var(--secondary); }
        .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .mini-day { font-size: 8px; text-align: center; padding: 2px 0; border-radius: 2px; color: var(--secondary); background: #252528; }
        .mini-day.checked { background: var(--success); color: #000; font-weight: bold; }
        .mini-day.empty { background: transparent; }

        #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: none; align-items: center; justify-content: center; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div id="loading-overlay">Szinkronizálás...</div>

<div class="container">
    <h2 style="margin: 5px 0 12px 0; font-size: 20px; text-align:center;">Havi Naptár</h2>
    
    <button class="mode-toggle" onclick="toggleView()" id="mode-btn">Éves összesítő nézet</button>

    <!-- Év Lapozó -->
    <div class="nav-group">
        <button class="nav-btn" onclick="changeYear(-1)">❮</button>
        <span id="year-display" class="nav-title">2026</span>
        <button class="nav-btn" onclick="changeYear(1)">❯</button>
    </div>
    
    <!-- Hónap Lapozó -->
    <div class="nav-group" id="month-nav-group">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <span id="month-display" class="nav-title">Július</span>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <!-- Heti fejek -->
    <div style="display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 5px;" id="weekday-headers">
        <div class="weekday-header">H</div>
        <div class="weekday-header">K</div>
        <div class="weekday-header">Sze</div>
        <div class="weekday-header">Cs</div>
        <div class="weekday-header">P</div>
        <div class="weekday-header">Szo</div>
        <div class="weekday-header">V</div>
    </div>

    <!-- Fő Grid -->
    <div class="calendar-grid" id="calendar-grid" style="margin-top: 5px;"></div>

    <!-- Statisztikai sorok -->
    <div class="stats-box">
        <div class="stats-row">
            <span>2026.09.20 óta tiszta napok:</span>
            <span class="stats-value" id="stat-total">0</span>
        </div>
        <div class="stats-row">
            <span>Utolsó egybefüggő tiszta napok:</span>
            <span class="stats-value" id="stat-streak">0</span>
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
    
    const DB_URL = "https://kiadaskoveto-2e474-default-rtdb.firebaseio.com/naptar_data.json";
    const months = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];
    
    let currentDate = new Date();
    let isYearView = false;
    let calendarData = {};

    async function init() {
        await loadRemoteData();
        render();
    }

    async function loadRemoteData() {
        showLoading(true);
        try {
            const res = await fetch(DB_URL);
            const data = await res.json();
            if(data) calendarData = data;
        } catch(e) { console.log("Offline mód"); }
        showLoading(false);
    }

    async function syncData() {
        try {
            await fetch(DB_URL, { method: 'PUT', body: JSON.stringify(calendarData) });
        } catch(e) { console.log("Hálózati hiba mentéskor"); }
    }

    function toggleView() {
        isYearView = !isYearView;
        document.getElementById('mode-btn').innerText = isYearView ? "Havi naptár nézet" : "Éves összesítő nézet";
        document.getElementById('month-nav-group').style.display = isYearView ? 'none' : 'flex';
        document.getElementById('weekday-headers').style.display = isYearView ? 'none' : 'grid';
        render();
    }

    function render() {
        let year = currentDate.getFullYear();
        let month = currentDate.getMonth();

        document.getElementById('year-display').innerText = year;
        document.getElementById('month-display').innerText = months[month];

        let grid = document.getElementById('calendar-grid');
        grid.innerHTML = "";

        if (isYearView) {
            grid.className = "year-view-container";
            for (let m = 0; m < 12; m++) {
                grid.appendChild(createMiniMonth(year, m));
            }
        } else {
            grid.className = "calendar-grid";
            renderMonthView(year, month, grid);
        }

        updateStats();
    }

    function renderMonthView(year, month, grid) {
        let firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
        let totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            let emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell empty';
            grid.appendChild(emptyCell);
        }

        for (let day = 1; day <= totalDays; day++) {
            let cell = document.createElement('div');
            cell.className = 'day-cell';
            let isChecked = calendarData[`cal_${year}_${month}_${day}`] === true;

            cell.innerHTML = `
                <span class="day-num">${day}</span>
                <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="saveCheck(${year}, ${month}, ${day}, this.checked)">
            `;
            grid.appendChild(cell);
        }
    }

    function createMiniMonth(year, month) {
        let monthDiv = document.createElement('div');
        monthDiv.className = 'mini-month';
        
        let title = document.createElement('div');
        title.className = 'mini-month-title';
        title.innerText = months[month];
        monthDiv.appendChild(title);

        let miniGrid = document.createElement('div');
        miniGrid.className = 'mini-grid';

        ["H","K","S","C","P","Sz","V"].forEach(d => {
            let h = document.createElement('div');
            h.className = 'mini-day';
            h.style.fontWeight = "bold";
            h.innerText = d;
            miniGrid.appendChild(h);
        });

        let firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
        let totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            let empty = document.createElement('div');
            empty.className = 'mini-day empty';
            miniGrid.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day++) {
            let dCell = document.createElement('div');
            dCell.className = 'mini-day';
            dCell.innerText = day;
            if (calendarData[`cal_${year}_${month}_${day}`] === true) {
                dCell.classList.add('checked');
            }
            miniGrid.appendChild(dCell);
        }

        monthDiv.appendChild(miniGrid);
        return monthDiv;
    }

    function changeYear(n) {
        currentDate.setFullYear(currentDate.getFullYear() + n);
        render();
    }

    function changeMonth(n) {
        currentDate.setMonth(currentDate.getMonth() + n);
        render();
    }

    async function saveCheck(year, month, day, status) {
        let key = `cal_${year}_${month}_${day}`;
        if(status) {
            calendarData[key] = true;
        } else {
            delete calendarData[key];
        }
        updateStats();
        await syncData();
    }

    function updateStats() {
        let startDate = new Date(2026, 8, 20); // 2026 Szeptember 20
        let today = new Date();
        today.setHours(0,0,0,0);

        let totalChecked = 0;
        let loopDate = new Date(startDate);

        while (loopDate <= today) {
            let y = loopDate.getFullYear();
            let m = loopDate.getMonth();
            let d = loopDate.getDate();

            if (calendarData[`cal_${y}_${m}_${d}`] === true) {
                totalChecked++;
            }
            loopDate.setDate(loopDate.getDate() + 1);
        }

        let streakCheckDate = new Date(today);
        let activeStreak = 0;
        while(true) {
            let y = streakCheckDate.getFullYear();
            let m = streakCheckDate.getMonth();
            let d = streakCheckDate.getDate();
            
            if (streakCheckDate < startDate) break;

            if (calendarData[`cal_${y}_${m}_${d}`] === true) {
                activeStreak++;
                streakCheckDate.setDate(streakCheckDate.getDate() - 1);
            } else {
                if (activeStreak === 0 && streakCheckDate.getTime() === today.getTime()) {
                    streakCheckDate.setDate(streakCheckDate.getDate() - 1);
                    let y2 = streakCheckDate.getFullYear();
                    let m2 = streakCheckDate.getMonth();
                    let d2 = streakCheckDate.getDate();
                    if (calendarData[`cal_${y2}_${m2}_${d2}`] === true) {
                        continue;
                    }
                }
                break;
            }
        }

        document.getElementById('stat-total').innerText = totalChecked;
        document.getElementById('stat-streak').innerText = activeStreak;
    }

    function showLoading(s) {
        document.getElementById('loading-overlay').style.display = s ? 'flex' : 'none';
    }

    init();
</script>
</body>
</html>
